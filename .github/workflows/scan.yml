name: Horizon scan

# Full pipeline: collect signals, detect emergence, score, publish.
#
# STATE. The DuckDB database is not committed (binary, grows, does not diff).
# It is carried between runs as a GitHub Release asset — the same pattern
# Tripwire uses for its SQLite corpus. Each run restores the latest database,
# adds to it, and publishes it back, so the corpus accumulates and growth
# curves lengthen instead of resetting every week. That Release asset stays
# the source of truth CI restores from.
#
# Only the small, readable outputs are committed: the shortlist, evidence
# cards and topics.csv.
#
# If storage.r2.enabled is true (bigthink_config.yaml) and the R2_* secrets
# below are set, the corpus is additionally mirrored to Cloudflare R2
# (BasicInfraSuggestion.md) after publish — a fixed URL to pull the latest
# corpus onto a laptop for Stage 3-5 tuning without re-running collection.
# Best-effort: a missing/unconfigured bucket does not fail the run.

on:
  schedule:
    # 19:00 UTC Sunday = ~05:00-06:00 Monday in Australian eastern time, so a
    # fresh scan is waiting at the start of the working week.
    - cron: "0 19 * * 0"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID (defaults to today's UTC date)"
        required: false
        default: ""
      skip_collect:
        description: "Reuse the existing corpus and only re-analyse"
        type: boolean
        required: false
        default: false
      sample:
        description: "Sample mode — cap records per query (fast smoke test)"
        type: boolean
        required: false
        default: false
      fresh_baseline:
        description: "Start from an empty database (do NOT restore the corpus release)"
        type: boolean
        required: false
        default: false
      log_level:
        description: "Logging level"
        required: false
        default: "INFO"
        type: choice
        options: [DEBUG, INFO, WARNING]

# DuckDB takes an exclusive file lock: two concurrent runs do not corrupt the
# database, they fail to open it. Serialise, and never cancel a run in flight —
# a half-finished collection still holds documents worth keeping.
concurrency:
  group: bigthink-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    name: Run horizon scan
    runs-on: ubuntu-latest
    # Collection is dominated by deliberate rate-limit delays (arXiv asks for
    # 3 s between requests; GDELT needs 6 s and still drops connections), not
    # by compute. Budget accordingly.
    #
    # Raised from 180 on 2026-08-30. Two changes landed together that both cost
    # requests: GDELT's window is now split into 4 date ranges per frame
    # (72 artlist requests at a measured 32-36 s each, against 18 before), and
    # the OpenAlex relevance floor no longer stops inside page one, so that
    # source pages properly. The 2026-08-30 run took 67 minutes; budget for
    # roughly double and leave room for GDELT's retry behaviour.
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve run ID
        id: runid
        run: |
          RUN_ID="${{ github.event.inputs.run_id }}"
          [ -z "$RUN_ID" ] && RUN_ID="$(date -u +%Y-%m-%d)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Run ID: $RUN_ID"

      # ------------------------------------------------------------------
      # Restore the accumulated corpus. A missing asset is normal on the
      # first run and must not fail the job.
      #
      # `fresh_baseline` skips the restore instead of deleting the release.
      # A change to what the collectors fetch — a relevance floor, a record-type
      # filter, a window width — makes the accumulated corpus a mixture of two
      # methods, and scores computed over a mixture describe neither. Starting
      # empty is the only honest response. Deleting the old release would also
      # destroy the record of the run being corrected, so it stays; the retention
      # rule below ages it out on its own.
      # ------------------------------------------------------------------
      - name: Restore corpus from latest data release
        if: ${{ github.event.inputs.fresh_baseline != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          TAG=$(gh release list --repo "${{ github.repository }}" --limit 100 \
                 --json tagName,createdAt \
                 --jq '[.[] | select(.tagName | startswith("corpus-"))]
                       | sort_by(.createdAt) | reverse | .[0].tagName // empty')
          if [ -n "$TAG" ]; then
            echo "Restoring corpus from release $TAG"
            gh release download "$TAG" --repo "${{ github.repository }}" \
               --pattern 'bigthink.duckdb' --dir data --clobber
            ls -lh data/bigthink.duckdb
          else
            echo "No corpus release found — starting a fresh database."
          fi

      - name: Note a fresh-baseline run
        if: ${{ github.event.inputs.fresh_baseline == 'true' }}
        run: |
          mkdir -p data
          echo "Fresh baseline: skipping corpus restore, collecting into an empty database."
          echo "Scores from this run are NOT comparable with any earlier run."

      - name: Run pipeline
        env:
          # Optional. Without a key OpenAlex allows only a small daily budget
          # per IP, which a shared Actions runner has usually already spent;
          # the collector then retires that source for the run and carries on.
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          # Optional. PatentsView is disabled in config by default; enable it
          # there once this key is set.
          PATENTSVIEW_API_KEY: ${{ secrets.PATENTSVIEW_API_KEY }}
        run: |
          ARGS="--run-id ${{ steps.runid.outputs.run_id }} --log-level ${{ github.event.inputs.log_level || 'INFO' }}"
          [ "${{ github.event.inputs.skip_collect }}" = "true" ] && ARGS="$ARGS --skip-collect"
          [ "${{ github.event.inputs.sample }}" = "true" ] && ARGS="$ARGS --sample"
          python -m src.pipeline $ARGS

      - name: Build the published site
        run: python -m src.report --run-id ${{ steps.runid.outputs.run_id }}

      # ------------------------------------------------------------------
      # Commit only the small, readable outputs: the shortlist, the evidence
      # cards, topics.csv, and the peer-review notebook the pipeline writes
      # after Stage 5 (data/outputs/<run_id>/horizon-scan-<run_id>.ipynb —
      # executed at generation time, so it reads without being run).
      # ------------------------------------------------------------------
      - name: Commit outputs
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/outputs/ docs/ || true
          git diff --cached --quiet || \
            git commit -m "scan: results for ${{ steps.runid.outputs.run_id }} [skip ci]"
          git push origin "${{ github.ref_name }}" || true

      # ------------------------------------------------------------------
      # Publish the corpus for the next run.
      # ------------------------------------------------------------------
      - name: Publish corpus as a data release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f data/bigthink.duckdb ]; then
            TAG="corpus-$(date -u +%Y%m%d-%H%M%S)"
            gh release create "$TAG" data/bigthink.duckdb \
              --repo "${{ github.repository }}" \
              --title "Corpus $TAG" \
              --notes "Accumulated corpus after run ${{ steps.runid.outputs.run_id }} (workflow run ${{ github.run_id }})."
            # Keep the five most recent corpus releases; older ones are dead weight.
            gh release list --repo "${{ github.repository }}" --limit 100 \
              --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("corpus-"))]
                    | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r old; do
                [ -n "$old" ] && gh release delete "$old" --repo "${{ github.repository }}" --yes --cleanup-tag || true
              done
          fi

      # ------------------------------------------------------------------
      # Best-effort mirror to Cloudflare R2. No-ops if storage.r2.enabled is
      # false in config (the default) or if the R2 secrets are not set.
      # ------------------------------------------------------------------
      - name: Mirror corpus to Cloudflare R2
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -f data/bigthink.duckdb ]; then
            python -m src.storage push-corpus || echo "R2 mirror skipped or failed — Release asset above remains the source of truth."
          fi

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ steps.runid.outputs.run_id }}-${{ github.run_id }}
          path: |
            data/outputs/
          retention-days: 90
          if-no-files-found: ignore
