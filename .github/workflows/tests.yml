name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The suite is offline by design — no test makes a network call, so CI
      # never depends on a third-party API being up.
      #
      # This job installs requirements.txt only, with no torch and no model
      # download. That is deliberate and is itself the test: the shipped
      # default is `bge` + `bertopic`, and the pipeline must still be runnable
      # and testable on a machine that has neither. Tests needing the ML stack
      # skip here and run in the `ml` job below.
      - name: Run tests
        run: python -m pytest tests/ -q

      # Config validation is the cheapest possible guard against a bad
      # threshold reaching a scheduled run: the weights are convex
      # combinations, and a set that does not sum to 1.0 silently rescales
      # every score in the output.
      - name: Validate shipped config and strategy files
        run: |
          python -c "from src.config import load_config; load_config(); print('config OK')"
          python -m src.stage0_strategy --show > /dev/null && echo "strategy files OK"
          python -c "
          from src.config import load_config
          from src.stage1_collect import load_scan_frame
          frames = load_scan_frame(load_config())
          print(f'scan frame OK — {len(frames)} frames')
          "

  # ------------------------------------------------------------------------
  # The default path. Since 2026-08-31 the shipped config is `bge` +
  # `bertopic`, so the cheap job above no longer exercises what a scheduled
  # scan actually runs — it exercises the fallback. This job covers the
  # default, and covers it offline: BERTopic is handed embeddings the caller
  # already computed, so it never loads a model, and no test here downloads
  # BGE. Separate rather than merged so a torch install cannot make the fast
  # feedback loop slow, and so a break in the optional stack is legible as
  # exactly that.
  # ------------------------------------------------------------------------
  ml:
    name: pytest (ML stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # CPU-only index: the default torch wheel pulls CUDA and does not fit.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ml.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # The seed is what makes a BERTopic run reproducible, so its absence
      # should fail here rather than silently produce a topic set nobody can
      # check. Cheap, and it names the failure precisely.
      - name: Check the shipped clustering config is reproducible
        run: |
          python -c "
          from src.config import load_config, bertopic_params, get
          config = load_config()
          params = bertopic_params(config, get(config, 'emergence', 'topics', 'min_topic_size', default=8))
          assert isinstance(params.random_state, int), 'BERTopic seed must be recorded'
          print(f'clustering OK — {params.describe()}')
          "
