name: Verify credentials

# Answers one question: do the optional credentials in this repository's
# secrets actually work against the live services?
#
# It exists because both integrations fail soft. OpenAlex retires itself for
# the run when its budget is spent and the R2 mirror step in scan.yml
# swallows its own errors, which is correct for a scheduled scan and useless
# for confirming a setup — a missing key and a working one both look like a
# quiet log. This workflow is the loud version, and it is the only place the
# secrets can be exercised, since nobody outside Actions can read them.
#
# Run it from the Actions tab (Run workflow) after adding or rotating a key.
# It also runs automatically when the checker itself changes, so the check
# cannot rot unnoticed.

on:
  workflow_dispatch:
    inputs:
      require:
        description: "Fail if a credential is not configured at all"
        type: boolean
        required: false
        default: true
  push:
    paths:
      - "src/verify_access.py"
      - ".github/workflows/verify-access.yml"

# Serialise: the R2 round-trip writes and deletes a uniquely-named object,
# but two concurrent runs would still race on the same daily OpenAlex budget.
concurrency:
  group: bigthink-verify-access
  cancel-in-progress: true

jobs:
  verify:
    name: Verify OpenAlex and R2 access
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # boto3 only — the checker deliberately imports nothing from the
      # pipeline except src.config, so a credential check cannot be blocked
      # by an unrelated dependency problem.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pyyaml

      - name: Verify credentials
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.require }}" != "false" ]; then
            ARGS="--require"
          fi
          python -m src.verify_access $ARGS
