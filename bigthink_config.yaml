# =============================================================================
# bigthink_config.yaml
#
# Single source of truth for every tunable parameter in the IPAVentures
# opportunity-identification pipeline. Nothing that changes a result should
# live in code — if you find yourself editing a threshold in a .py file, it
# belongs here instead.
#
# Pattern borrowed from Tripwire (tripwire_config.yaml): one validated YAML
# file, checked at the start of every run, version-controlled so any past run
# can be reproduced from the commit that produced it.
# =============================================================================

pipeline:
  # Free-text label recorded against every run so results are traceable.
  run_label: "ipaventures-horizon-scan"
  max_retries: 3
  retry_base_delay_seconds: 2.0
  # Sent as the User-Agent and OpenAlex/Crossref `mailto` for the polite pool.
  # Polite-pool access is materially faster and is a condition of fair use.
  contact_email: "thomasamann23@gmail.com"
  user_agent: "IPAVentures-BigThink/0.1 (horizon scanning; +https://github.com/Thomas-Amann-IPAustralia/BigThink)"
  # When true, collectors stop after `sample_limit` records per query. Use for
  # development so a full scan is never accidentally triggered on a laptop.
  sample_mode: false
  sample_limit: 50

storage:
  duckdb_path: "data/bigthink.duckdb"
  raw_dir: "data/raw"
  strategy_dir: "data/strategy"
  outputs_dir: "data/outputs"
  # Raw payloads are large and reproducible; they are gitignored by default.
  # Set to true only if you have Cloudflare R2 (or similar) configured.
  keep_raw_payloads: true

  # Cloudflare R2 (BasicInfraSuggestion.md) — durable store for the DuckDB
  # corpus and raw payloads across ephemeral GitHub Actions runners, and the
  # way to pull an already-collected corpus onto a laptop for Stage 3-5
  # tuning without re-running collection. Off by default: the pipeline must
  # run with zero external storage configured, same as the API keys below.
  # Credentials (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY) come
  # from environment variables, never from this file. See README.md.
  r2:
    enabled: true
    bucket: "bigthink-corpus"
    # Set to the jurisdiction the bucket was created in, or leave empty.
    # A jurisdiction-restricted bucket lives on its own S3 endpoint
    # (<account>.<jurisdiction>.r2.cloudflarestorage.com) and is invisible
    # from the default one — every call returns AccessDenied, which looks
    # exactly like a permissions problem. An API token's resource key names
    # it: com.cloudflare.edge.r2.bucket.<account>_<jurisdiction>_<bucket>.
    jurisdiction: "eu"
    corpus_key: "bigthink.duckdb"
    raw_prefix: "raw"

embeddings:
  # Two backends, same interface (see src/embeddings.py):
  #   hashing  — dependency-free character n-gram hashing + TF-IDF. Runs
  #              anywhere, no model download. Used for CI, tests, and any
  #              environment without torch.
  #   bge      — BAAI/bge-base-en-v1.5 sentence-transformers, the same model
  #              Tripwire uses at Stage 5. Better quality; ~400 MB download.
  # Start on `hashing` to get the pipeline shaped, switch to `bge` before you
  # trust the strategic-fit numbers.
  backend: "hashing"
  bge_model: "BAAI/bge-base-en-v1.5"
  hashing_dimensions: 2048
  # Cache computed vectors in DuckDB so re-runs do not re-embed a stable corpus.
  cache_vectors: true

# -----------------------------------------------------------------------------
# Stage 0 — Strategy encoding
# -----------------------------------------------------------------------------
strategy:
  # Documents parsed into the strategic reference set. Paths are repo-relative.
  documents:
    - path: "StrategicCorporatePlan26-27.md"
      label: "IP Australia Strategic Corporate Plan 2026-27"
      weight: 1.0
    - path: "IPA-Annual-Report-2025.md"
      label: "IP Australia Annual Report 2024-25"
      weight: 0.6
  # Hand-curated from the Corporate Plan's "Strategic objectives" section.
  # Refresh yearly when the plan is republished.
  objectives_file: "data/strategy/objectives.yaml"
  # DISR List of Critical Technologies in the National Interest — the seven
  # fields. Used both as a strategic-priority filter and a scan seed.
  critical_technologies_file: "data/strategy/critical_technologies.yaml"

# -----------------------------------------------------------------------------
# Stage 1 — Signal collection
# -----------------------------------------------------------------------------
collection:
  # Scan window. Emergence detection needs enough history to fit a growth
  # curve; 8 years is the shortest window that gives a stable CAGR.
  start_year: 2018
  end_year: 2026
  # Seed queries live in a separate file so the scan frame is reviewable as a
  # standalone artefact — it is the single biggest determinant of what the
  # scan can possibly find, and reviewers should be able to read it alone.
  scan_frame_file: "data/strategy/scan_frame.yaml"

  sources:
    openalex:
      enabled: true
      # A key is effectively required, not optional. Measured 2026-08-30 from
      # the live rate-limit headers: unauthenticated callers get $0.10/day and
      # a key gets $1.00/day, at $0.001 (10 credits) per request. That is 100
      # requests/day without a key and 1,000 with one. A full scan at the
      # ceiling below is 100 requests — comfortable with a key, the entire
      # daily allowance without. `mailto` buys the polite pool, not budget.
      per_page: 200
      max_pages_per_query: 5
      min_year: 2018
      # Drop results scoring below this fraction of an anchor score. Absolute
      # cut-offs cannot work — relevance scores are not comparable across
      # queries — so the floor is relative.
      min_relative_score: 0.4
      # WHICH result anchors it, 1-indexed. This matters more than the fraction
      # above. OpenAlex relevance blends text match with citation count, so a
      # query naming a well-known field returns one enormous score and a normal
      # tail; anchoring on that maximum (rank 1) made the yield a function of
      # how much of an outlier the top hit was. On the 2026-08-30 run that kept
      # 3 records for ct_quantum and 110 for ct_biotech — same query shape,
      # comparable literature, 37x spread across the frame set, and it bit
      # hardest on the frames closest to IP Australia's own subject matter.
      # Rank 10 is robust to a single anomalous score. Set to 1 to reproduce
      # runs collected before 2026-08-30.
      relevance_anchor_rank: 10
    arxiv:
      enabled: true
      # Fastest emergence signal for AI/CS — publication lag measured in days,
      # not the ~18 months patents carry.
      #
      # Collected one year at a time. Sorting by date and taking the first N
      # returns a corpus with no history — on the 2026-08-29 run that gave
      # 1,449 arXiv documents dated 2026 and none before 2022, which reads
      # downstream as an explosion of activity rather than as a sampling
      # artefact. Per-year quotas cost more requests and are the only way this
      # source can support a growth curve.
      max_results_per_query: 270      # spread across the scan window
      max_results_per_year: 30        # explicit per-year quota; overrides the split
      # arXiv asks for >=3 s between requests. Honour it — but treat it as a
      # floor rather than the real limit. The 2026-08-31 run took 28 HTTP 429s
      # at this delay from a shared Actions IP and lost six of nine frames.
      request_delay_seconds: 3.0
      # After each 429 the delay is multiplied by this and kept there for the
      # rest of the run, up to the ceiling below (src/collectors/arxiv.py).
      # Measured rather than configured: what a shared IP actually gets is not
      # what the published limit says, and it varies with arXiv's load, so a
      # single hand-set number is either too slow every week or too fast on the
      # week it matters. Costs nothing when arXiv is healthy.
      rate_limit_backoff_factor: 1.5
      # 81 year-requests (9 frames x 2018-2026) is ~4 min at 3 s and ~27 at
      # 20 s. Run time is the binding constraint now (PROJECT_STATE issue 17),
      # so this is the number to lower if the job starts running long.
      max_request_delay_seconds: 20.0
    crossref:
      enabled: true
      rows_per_query: 100
      # Offset paging, not cursor — cursor paging discards Crossref's relevance
      # ordering entirely. See the note in src/collectors/crossref.py.
      max_pages_per_query: 2
      min_relative_score: 0.4
      # Anchored on the maximum, unlike OpenAlex: Crossref's score decays
      # gently and this floor rarely binds (197.8 of a possible 200 records per
      # query on the 2026-08-30 run). Left at 1 so the OpenAlex fix does not
      # silently change this source too.
      relevance_anchor_rank: 1
      # Crossref registers peer-review reports and back-matter as first-class
      # records with their own DOIs, so deduplication cannot see them and the
      # reviews of one paper cluster very tightly — they share its title. On
      # the 2026-08-30 run that produced two of the fifteen shortlisted topics,
      # one carrying the highest emergence score in the run. Every measurement
      # was correct; the input was wrong.
      exclude_types: ["peer-review", "component"]
      # Book bibliographies registered under their own DOI, titled only this.
      exclude_titles: ["references", "bibliography", "index"]
    gdelt:
      enabled: true
      # Attention/salience proxy.
      #
      # `max_records_per_query` is per REQUEST, and GDELT caps it at 250.
      # `artlist` sorts most-recent-first, so a single request returns the
      # newest 250 articles and nothing older however wide the window: on the
      # 2026-08-30 run every one of the 2,040 GDELT documents carried a 2026
      # date, and a live re-test of `timespan=24m` returned only 2026-06 to
      # 2026-08. Splitting the window into explicit date ranges is the only way
      # to get history out of this API.
      max_records_per_query: 250
      timespan_months: 24
      # Number of equal date ranges the window is split into. Each costs one
      # request, measured at 32-36 s, and GDELT drops connections without an
      # error code from shared runners — so this is the main lever on both
      # coverage and run time. 4 gives 6-month windows and up to 1,000 articles
      # per frame. A failed window is recorded and the rest still attempted.
      # Set to 1 to reproduce runs collected before 2026-08-30.
      window_chunks: 4
    datagovau:
      enabled: true
      # CKAN at https://data.gov.au/data/api/3 — policy + IP Australia's own
      # published datasets (IP RAPID, IPGOD).
      rows_per_query: 50
    patentsview:
      # Requires a free API key from https://patentsview.org (env: PATENTSVIEW_API_KEY).
      # Disabled by default so a run without the key is clean rather than noisy.
      enabled: false
      rows_per_query: 1000
      max_pages_per_query: 5

  # STEEPV tagging. Every collected document is assigned one primary category.
  # Source-level defaults; overridden per-document when the scan frame entry
  # declares its own category.
  steepv_default_by_source:
    openalex: "Technological"
    arxiv: "Technological"
    crossref: "Technological"
    gdelt: "Social"
    datagovau: "Political"
    patentsview: "Technological"

# -----------------------------------------------------------------------------
# Stage 2 — Trend and emergence detection
# -----------------------------------------------------------------------------
emergence:
  # Time slicing for burst detection and growth curves.
  time_slice: "year"          # year | quarter
  min_docs_per_topic: 20      # burst literature standard; below this, bursts are noise
  min_slices_for_growth: 4    # need at least 4 points to fit a curve

  # --- Kleinberg (2003) two-state burst automaton ---
  # Defaults follow the parameters most commonly reported in the scientometrics
  # literature. s scales the burst-state rate; gamma is the state-transition cost.
  burst:
    s: 2.0
    gamma: 1.0

  # --- Topic formation ---
  topics:
    # Which sources are allowed to FORM topics.
    #
    # GDELT is deliberately excluded. Its records are bare multilingual news
    # headlines with no abstract — roughly 70 characters of text against
    # arXiv's 1,400 — and at 40%+ of a typical corpus they dominate clustering
    # and produce topics like "brainrot / ai art" and "aus den / australien
    # verbannt". GDELT's role in this method is an attention proxy for the
    # Stage 4 index, which is exactly what it is good at.
    #
    # Documents from excluded sources are still attached to the nearest topic
    # afterwards, so they count toward attention and the time series without
    # having distorted the topic that they are being counted against.
    forming_sources: ["openalex", "crossref", "arxiv", "datagovau", "patentsview"]
    # `agglomerative` is true average-linkage clustering: no heavy deps,
    # deterministic, and order-invariant. `leader` is the pre-2026-08-30
    # sequential nearest-centroid method, kept only to reproduce old runs — it
    # builds a mega-cluster by construction (see src/topics.py). Switch to
    # `bertopic` once you install requirements-ml.txt.
    method: "agglomerative"
    # A cosine threshold depends on BOTH the backend and the method, because
    # each names a different quantity.
    #
    #   Backend sets the SCALE. Hashed TF-IDF puts two closely-related
    #   abstracts around 0.25-0.35; BGE puts the same pair above 0.8.
    #
    #   Method sets WHAT THE COSINE IS BETWEEN. `leader` compares a document to
    #   a cluster centroid — an average of many vectors, and so similar to
    #   almost everything. `agglomerative` compares the mean pairwise
    #   similarity between two clusters' members, which is far lower on
    #   identical data.
    #
    # Measured on 2,987 real OpenAlex documents under `hashing` (2026-08-30):
    # mean pairwise cosine 0.075, 99th percentile 0.191. At the leader value of
    # 0.30, average linkage assigned 23 of 2,987 documents. Carrying one number
    # across methods is the same error as carrying one across backends.
    similarity_thresholds:
      agglomerative:
        # 0.14 from a sweep over those 2,987 documents: 61 topics, 56% of the
        # corpus assigned, largest cluster 10% of everything assigned, and
        # every label interpretable ("energy / storage / battery / renewable",
        # "quantum / cryptography / cryptographic / security"). Below 0.12 the
        # largest cluster passes 25% and climbs fast; above 0.16 coverage
        # collapses. Re-sweep on the fresh baseline — that corpus is
        # OpenAlex-only and the real one will not be.
        hashing: 0.14
        # NOT calibrated — no BGE sweep has ever been run (PROJECT_STATE issue
        # 8). BGE cosines run much higher than hashed TF-IDF, so this is a
        # shape-preserving guess and nothing more.
        bge: 0.45
      leader:
        # 0.30 from the 2026-08-29 sweep on a 4,195-document corpus that no
        # longer exists. On the 2026-08-30 corpus it produced a catch-all
        # holding 57% of everything assigned. Kept for reproducibility only.
        hashing: 0.30
        # NOT calibrated. Never swept.
        bge: 0.62
    # Documents from sources outside `forming_sources` are attached to the
    # nearest topic at this fraction of the clustering threshold. Looser on
    # purpose: attachment happens after centroids are fixed and cannot move
    # them, so the question is only "which topic is this news article most
    # about?", not "is this tight enough to define a topic?". At the full
    # clustering threshold almost no news headline attaches at all, and the
    # attention component of the Stage 4 index goes empty.
    attachment_threshold_ratio: 0.6
    min_topic_size: 8
    # A cluster can pass min_topic_size on documents sharing one generic word —
    # a run of data.gov.au dataset titles produced a topic whose whole
    # vocabulary was "index", which then ranked eighth. A theme that cannot be
    # described in three distinct terms is not a theme.
    min_distinct_terms: 3
    max_topics: 120
    # Terms appearing in fewer than this many documents are dropped before
    # topic formation, so single-paper coinages cannot become "topics".
    min_term_document_frequency: 5

  # --- Rotolo, Hicks & Martin (2015) five attributes of emergence ---
  # Each maps to one computable indicator. Weights sum to 1.0; they are a
  # judgement call, not a finding — see docs/method.md before changing them,
  # and record any change in PROJECT_STATE.md.
  rotolo_weights:
    novelty: 0.25        # mean embedding distance to the prior-period corpus centroid
    growth: 0.30         # slice-over-slice CAGR, blended with Kleinberg burst weight
    coherence: 0.15      # intra-topic cosine density
    impact: 0.20         # citation / attention percentile
    uncertainty: 0.10    # dispersion of actors and source types (normalised entropy)

  # --- Three Horizons banding ---
  # A topic is assigned a horizon from its logistic-curve maturity, not its age.
  # These cut-points are on the fitted curve's inflection position.
  three_horizons:
    h1_max_maturity: 0.75   # >= this => H1: established, 0-3 yrs, sustain current system
    h2_max_maturity: 0.35   # >= this => H2: transitional/emerging
    # below h2_max_maturity => H3: 10-30 yr paradigm shift

  # --- Weak-signal 2x2 (Park & Kim / WISDOM) ---
  # Topics are placed on average-proportion (x) vs growth-rate (y).
  weak_signal:
    proportion_percentile_split: 50
    growth_percentile_split: 50

# -----------------------------------------------------------------------------
# Stage 3 — Strategic fit and asset leverage
# -----------------------------------------------------------------------------
scoring:
  strategic_fit:
    # Cosine similarity of the topic centroid to Stage 0 reference vectors,
    # blended with a lexical overlap term so a topic that names an objective
    # explicitly is not penalised by embedding drift.
    embedding_weight: 0.7
    lexicon_weight: 0.3
    # Bonus applied when a topic maps to a DISR critical-technology field.
    critical_tech_bonus: 0.10
  asset_leverage:
    # Overlap between a topic and IP Australia's own data/capability inventory.
    inventory_file: "data/strategy/asset_inventory.yaml"
    embedding_weight: 0.6
    lexicon_weight: 0.4

# -----------------------------------------------------------------------------
# Stage 4 — Opportunity-size index
# -----------------------------------------------------------------------------
# THIS IS A RELATIVE INDEX, NOT A MARKET SIZE. It is deliberately unitless.
# Do not present any output of this stage as a dollar figure. See the caveats
# in SuggestedConceptualApproach.md and docs/method.md.
opportunity_index:
  components:
    research_growth: 0.30     # publication CAGR percentile
    attention: 0.25           # GDELT volume percentile
    attention_tone: 0.10      # GDELT tone (positive salience)
    policy_salience: 0.20     # mentions across policy/strategy corpus
    patent_activity: 0.15     # patent filing growth (0 when PatentsView disabled;
                              # weight is redistributed proportionally at runtime)
  # Refuse to emit an index for topics thinner than this — a composite built on
  # two documents looks identical to one built on two hundred, which is exactly
  # how a horizon scan misleads people.
  min_documents: 15

# -----------------------------------------------------------------------------
# Stage 5 — Synthesis and ranking
# -----------------------------------------------------------------------------
synthesis:
  shortlist_size: 15
  # Final ranking weights across the three axes that survive the caveats.
  rank_weights:
    emergence: 0.40
    strategic_fit: 0.35
    asset_leverage: 0.25
  # Evidence cards carry the top-N source documents per topic so every score is
  # traceable to primary text. This is the audit trail; do not set it to 0.
  evidence_documents_per_topic: 8
  # Doblin Ten Types is applied as a human diagnostic at synthesis, not scored.
  doblin_prompt_in_cards: true

# -----------------------------------------------------------------------------
# Notebook export — the peer-review artefact
# -----------------------------------------------------------------------------
# `python -m src.notebook --run-id RUN` writes a Jupyter notebook that walks one
# frozen run stage by stage and re-derives its numbers from stored inputs. It is
# the artefact to hand a reviewer who should be able to argue with the method
# rather than take the shortlist on trust.
#
# Nothing here changes a score. The notebook only reads DuckDB, and it verifies
# against the config snapshot stored with the run rather than against this file.
notebook:
  enabled: true
  # Topics given a full evidence section (terms, trajectory, source documents).
  # Reading primary documents is the only quality control that finds clustering
  # artefacts, so this should stay large enough to be worth doing.
  topics_detailed: 8
  # Documents shown per topic. Defaults to synthesis.evidence_documents_per_topic.
  evidence_documents_per_topic: 5
  # The cells that recompute emergence, horizon band, opportunity index and the
  # composite rank from their stored inputs. Turning this off removes the only
  # part of the notebook a reviewer cannot get from the HTML report — leave it on.
  include_verification: true

# -----------------------------------------------------------------------------
# Dashboard — interactive point-cloud explorer, published to docs/dashboard.html
# -----------------------------------------------------------------------------
# `python -m src.dashboard --run-id RUN` re-embeds the run's documents (reusing
# the vector cache when the backend is cacheable) and projects them to 2D so a
# reader can see the corpus as a map rather than a ranked table — the same
# vectors and topic assignments Stage 2 computed, laid out for exploration
# rather than clustering. Nothing here changes a score; this is presentation
# only, generated after Stage 5.
dashboard:
  enabled: true
  # Caps the point cloud so the published page stays a reasonable download as
  # the corpus accumulates week over week. Below the cap, every document is
  # plotted; above it, every topic-assigned document is kept (that is the
  # signal worth exploring) and the remainder — chiefly GDELT attention
  # signal, which forms no topics — is downsampled to fill what is left.
  max_points: 25000
  projection:
    # "umap" if umap-learn is installed, else a numpy-only PCA fallback with
    # no extra dependency — the same graceful-degradation shape as the bge
    # embedding backend. UMAP separates topic clusters far better; PCA still
    # produces a real, honest 2D map, just a flatter one.
    method: "umap"
    n_neighbors: 15
    min_dist: 0.1
    metric: "cosine"
    # Fixed so the same corpus lays out the same way between runs. UMAP is
    # still stochastic in fine detail — this bounds it, it does not remove it.
    random_state: 42
